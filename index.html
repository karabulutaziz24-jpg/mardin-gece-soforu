<!<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mardin Gece Şoförü</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#080808;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.container{
    width:100%;
    max-width:500px;
    margin:auto;
    padding:20px;
}

.header{
    text-align:center;
    padding:55px 0 35px;
}

.logo{
    width:58px;
    height:58px;
    margin:0 auto 18px;
    border-radius:18px;
    background:linear-gradient(145deg,#efd477,#9b6c20);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#080808;
    font-weight:900;
    font-size:20px;
}

h1{
    margin:0;
    color:#dfbd61;
    font-size:28px;
    letter-spacing:1px;
}

.header p{
    color:#888;
    font-size:13px;
    margin-top:10px;
}

.card{
    background:#111;
    border:1px solid #292929;
    border-radius:22px;
    padding:24px 20px;
    box-shadow:0 18px 50px rgba(0,0,0,.45);
}

h2{
    text-align:center;
    margin:0 0 25px;
    font-size:22px;
}

label{
    display:block;
    color:#aaa;
    font-size:13px;
    margin-bottom:7px;
}

input,
textarea{
    width:100%;
    border:1px solid #333;
    background:#191919;
    color:#fff;
    border-radius:12px;
    padding:14px;
    margin-bottom:17px;
    font-size:15px;
    outline:none;
}

input:focus,
textarea:focus{
    border-color:#d9b65c;
}

textarea{
    height:80px;
    resize:none;
}

button{
    width:100%;
    border:0;
    border-radius:13px;
    padding:16px;
    background:linear-gradient(135deg,#efd477,#a87525);
    color:#080808;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
}

button:active{
    transform:scale(.98);
}

.whatsapp{
    display:block;
    text-align:center;
    margin-top:18px;
    color:#3dde8b;
    font-size:13px;
}

.info{
    text-align:center;
    color:#777;
    font-size:11px;
    line-height:1.6;
    margin-top:20px;
}

.footer{
    text-align:center;
    color:#555;
    font-size:11px;
    padding:30px 0;
}

.success{
    display:none;
    margin-top:15px;
    padding:14px;
    border-radius:12px;
    background:#102319;
    border:1px solid #245d3c;
    color:#8ff0b5;
    text-align:center;
    font-size:13px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">
            MG
        </div>

        <h1>MARDİN GECE ŞOFÖRÜ</h1>

        <p>
            Güvenli dönüşünüz için yanınızdayız.
        </p>

    </div>


    <div class="card">

        <h2>Randevu Oluştur</h2>

        <form id="randevuForm">

            <label>Ad Soyad</label>

            <input
                type="text"
                id="adsoyad"
                placeholder="Adınız ve soyadınız"
                required
            >


            <label>Telefon</label>

            <input
                type="tel"
                id="telefon"
                placeholder="05XX XXX XX XX"
                required
            >


            <label>Alınacak Konum</label>

            <input
                type="text"
                id="konum"
                placeholder="Nereden alınacaksınız?"
                required
            >


            <label>Gidilecek Adres</label>

            <input
                type="text"
                id="adres"
                placeholder="Nereye gideceksiniz?"
                required
            >


            <label>Tarih</label>

            <input
                type="date"
                id="tarih"
                required
            >


            <label>Saat</label>

            <input
                type="time"
                id="saat"
                required
            >


            <label>Ek Bilgi</label>

            <textarea
                id="not"
                placeholder="Varsa belirtmek istediğiniz bilgi">
            </textarea>


            <button type="submit">
                🚘 RANDEVU GÖNDER
            </button>

        </form>


        <div
            id="success"
            class="success">
            Randevu bilgileri hazırlanıyor...
        </div>


        <div class="info">
            Randevu talebiniz WhatsApp üzerinden
            işletmeye iletilir.
            <br>
            Ödeme alınmaz.
        </div>


        <a
            class="whatsapp"
            href="https://wa.me/905054727010"
            target="_blank">

            WhatsApp'tan direkt ulaş

        </a>

    </div>


    <div class="footer">

        © 2026 Mardin Gece Şoförü

    </div>

</div>


<script>

document
.getElementById("randevuForm")
.addEventListener("submit", function(e){

    e.preventDefault();


    const adsoyad =
        document.getElementById("adsoyad").value;

    const telefon =
        document.getElementById("telefon").value;

    const konum =
        document.getElementById("konum").value;

    const adres =
        document.getElementById("adres").value;

    const tarih =
        document.getElementById("tarih").value;

    const saat =
        document.getElementById("saat").value;

    const not =
        document.getElementById("not").value.trim();


    const mesaj =

`🚘 YENİ RANDEVU TALEBİ

👤 Ad Soyad:
${adsoyad}

📱 Telefon:
${telefon}

📍 Alınacak Konum:
${konum}

🏁 Gidilecek Adres:
${adres}

📅 Tarih:
${tarih}

⏰ Saat:
${saat}

📝 Ek Bilgi:
${not || "Belirtilmedi"}

━━━━━━━━━━━━━━
MARDİN GECE ŞOFÖRÜ`;


    document.getElementById("success").style.display="block";


    const whatsapp =
        "https://wa.me/905054727010?text="
        + encodeURIComponent(mesaj);


    setTimeout(function(){

        window.location.href = whatsapp;

    },500);

});

</script>

</body>
</html>
