<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mardin Gece Şoförü</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080808;
    color: #fff;
    font-family: Arial, sans-serif;
}

.container {
    width: 100%;
    max-width: 480px;
    margin: auto;
    padding: 25px 18px 40px;
}

.logo {
    text-align: center;
    padding: 45px 0 30px;
}

.logo h1 {
    margin: 0;
    color: #d8b35a;
    font-size: 28px;
    letter-spacing: 1px;
}

.logo p {
    color: #999;
    font-size: 13px;
    margin-top: 10px;
}

.card {
    background: #111;
    border: 1px solid #292929;
    border-radius: 20px;
    padding: 22px;
    box-shadow: 0 15px 45px rgba(0,0,0,.45);
}

.card h2 {
    text-align: center;
    margin: 5px 0 25px;
}

label {
    display: block;
    color: #aaa;
    font-size: 13px;
    margin-bottom: 7px;
}

input,
textarea {
    width: 100%;
    padding: 14px;
    margin-bottom: 17px;
    border-radius: 12px;
    border: 1px solid #333;
    background: #1a1a1a;
    color: white;
    font-size: 15px;
    outline: none;
}

input:focus,
textarea:focus {
    border-color: #d8b35a;
}

textarea {
    height: 80px;
    resize: none;
}

button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 13px;
    background: linear-gradient(135deg,#e5c96f,#a97a27);
    color: #080808;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(.98);
}

.info {
    text-align: center;
    color: #777;
    font-size: 11px;
    line-height: 1.5;
    margin-top: 18px;
}

.direct {
    display: block;
    text-align: center;
    color: #40df8c;
    margin-top: 18px;
    font-size: 13px;
}

.footer {
    text-align: center;
    color: #555;
    font-size: 11px;
    margin-top: 30px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <h1>MARDİN GECE ŞOFÖRÜ</h1>
        <p>Güvenli dönüşünüz için yanınızdayız.</p>
    </div>

    <div class="card">

        <h2>Randevu Oluştur</h2>

        <form id="randevuForm">

            <label>Ad</label>
            <input
                type="text"
                id="ad"
                placeholder="Adınız"
                required
            >

            <label>Soyad</label>
            <input
                type="text"
                id="soyad"
                placeholder="Soyadınız"
                required
            >

            <label>Telefon</label>
            <input
                type="tel"
                id="telefon"
                placeholder="05XX XXX XX XX"
                required
            >

            <label>Nereden alınacaksınız?</label>
            <input
                type="text"
                id="konum"
                placeholder="Alınacak konum"
                required
            >

            <label>Nereye gideceksiniz?</label>
            <input
                type="text"
                id="adres"
                placeholder="Gidilecek adres"
                required
            >

            <label>Tarih</label>
            <input
                type="date"
                id="tarih"
                required
            >

            <label>Saat</label>
            <input
                type="time"
                id="saat"
                required
            >

            <label>Ek bilgi</label>
            <textarea
                id="not"
                placeholder="Varsa eklemek istediğiniz bilgi">
            </textarea>

            <button type="submit">
                RANDEVU GÖNDER
            </button>

        </form>

        <div class="info">
            Randevu bilgileriniz WhatsApp üzerinden
            Mardin Gece Şoförü'ne iletilir.
        </div>

        <a
            class="direct"
            href="https://wa.me/905054727010"
            target="_blank"
        >
            WhatsApp'tan direkt ulaş
        </a>

    </div>

    <div class="footer">
        © 2026 Mardin Gece Şoförü
    </div>

</div>


<script>

document
.getElementById("randevuForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const ad =
        document.getElementById("ad").value;

    const soyad =
        document.getElementById("soyad").value;

    const telefon =
        document.getElementById("telefon").value;

    const konum =
        document.getElementById("konum").value;

    const adres =
        document.getElementById("adres").value;

    const tarih =
        document.getElementById("tarih").value;

    const saat =
        document.getElementById("saat").value;

    const not =
        document.getElementById("not").value.trim();

    const mesaj =

`🚘 YENİ RANDEVU

👤 Müşteri:
${ad} ${soyad}

📱 Telefon:
${telefon}

📍 Alınacak yer:
${konum}

🏁 Gidilecek yer:
${adres}

📅 Tarih:
${tarih}

⏰ Saat:
${saat}

📝 Ek bilgi:
${not || "Yok"}

Mardin Gece Şoförü`;

    const whatsapp =
        "https://wa.me/905054727010?text="
        + encodeURIComponent(mesaj);

    window.location.href = whatsapp;

});

</script>

</body>
</html>
